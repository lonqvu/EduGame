server:
  port: ${SERVER_PORT:8080}
  # Behind a reverse proxy (Caddy, Nginx) on a private network, take the client address from X-Forwarded-For;
  # the header is ignored when the request does not come from such a proxy.
  forward-headers-strategy: native
  shutdown: graceful
  error:
    include-stacktrace: never

spring:
  application:
    name: edu-game-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:edugame}
    username: ${DB_USERNAME:edugame}
    password: ${DB_PASSWORD:edugame}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway. Never use create / update.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    # The dev-only seed (R__dev_seed.sql) may be in the history of a local DB; do not fail
    # when the app later starts without the "dev" profile.
    ignore-migration-patterns: "repeatable:missing,*:future"

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  # SMTP. Defaults point at Mailpit from docker-compose (dev); production sets a real provider (SES, Brevo...).
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.edugame

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    # Development aid: code of the user a request acts as when it carries no access token.
    # Empty (the default) = such requests are anonymous (teacher endpoints answer 401).
    default-user-code: ${APP_DEFAULT_USER_CODE:}
    jwt:
      # HMAC-SHA256 key that signs access tokens, at least 32 bytes. Required: startup fails without it.
      secret: ${JWT_SECRET:}
      issuer: edu-game
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh:
      remember-ttl: ${REFRESH_REMEMBER_TTL:30d}
      session-ttl: ${REFRESH_SESSION_TTL:12h}
      reuse-grace: 10s
      cookie-name: edugame_refresh
      cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    # Failed sign-ins: lock a username / email (or a client address) for a while after too many.
    login:
      max-failures: 5
      max-failures-per-ip: 30
      window: 15m
      lock-for: 15m
    # One-time codes mailed to confirm an email address (sign-up).
    verification:
      code-ttl: 10m
      max-attempts: 5
      resend-cooldown: 60s
      max-sends-per-hour: 5
  mail:
    from: ${MAIL_FROM:EduGame <no-reply@edugame.local>}
    # Also write verification codes to the log. Development only.
    log-codes: false
  # Used for "this week" star totals.
  time-zone: ${APP_TIME_ZONE:Asia/Ho_Chi_Minh}
  # Images teachers upload for their questions, served back at /api/v1/assets/{key}.
  assets:
    dir: ${ASSET_DIR:./data/assets}
  # "Góp ý": addresses every new feedback is mailed to, comma separated. Empty: only stored (admin API).
  feedback:
    notify-to: ${FEEDBACK_NOTIFY_TO:}

logging:
  level:
    root: INFO
    com.edugame: ${LOG_LEVEL_APP:DEBUG}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:INFO}
