server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never

spring:
  application:
    name: edu-game-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:edugame}
    username: ${DB_USERNAME:edugame}
    password: ${DB_PASSWORD:edugame}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway. Never use create / update.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    # The dev-only seed (R__dev_seed.sql) may be in the history of a local DB; do not fail
    # when the app later starts without the "dev" profile.
    ignore-migration-patterns: "repeatable:missing,*:future"

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.edugame

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    # Temporary until the auth module exists: code of the user every request acts as.
    # Empty = no current user (all teacher endpoints answer 401).
    default-user-code: ${APP_DEFAULT_USER_CODE:}
  # Used for "this week" star totals.
  time-zone: ${APP_TIME_ZONE:Asia/Ho_Chi_Minh}

logging:
  level:
    root: INFO
    com.edugame: ${LOG_LEVEL_APP:DEBUG}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:INFO}
