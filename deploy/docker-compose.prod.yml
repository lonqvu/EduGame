# Production stack. On the VPS this file is /opt/edugame/docker-compose.yml (CI copies it there),
# next to the .env made from deploy/.env.prod.example.
name: edugame

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-edugame}
      POSTGRES_USER: ${DB_USERNAME:-edugame}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      TZ: UTC
      PGTZ: UTC
    # No published port: only the backend reaches it, over the compose network.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX in .env}/backend:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      ASSET_DIR: /data/assets
      JAVA_TOOL_OPTIONS: -Xmx${JAVA_MAX_HEAP:-768m}
    volumes:
      - assets:/data/assets
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${IMAGE_PREFIX}/web:${TAG:-latest}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  assets:
  caddy-data:
  caddy-config:
