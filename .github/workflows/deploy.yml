# Test every push and pull request. On main, also build the images, push them to GHCR
# and roll the VPS onto them.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   VPS_HOST     IP or domain of the server
#   VPS_USER     the SSH user (deploy, in the docker group)
#   VPS_SSH_KEY  private key whose public half is in ~deploy/.ssh/authorized_keys
# The VPS keeps its own /opt/edugame/.env (see deploy/.env.prod.example).
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      # The API tests run against a real Postgres, like on a developer machine.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: edugame
          POSTGRES_USER: edugame
          POSTGRES_PASSWORD: edugame
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edugame -d edugame"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # Catches the verification mails the auth tests trigger.
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ["1025:1025"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - working-directory: backend
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm test

  images:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        name: Image names
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "version=$(date -u +%F) ${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/backend:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            VITE_APP_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.prefix }}/web:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: images
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Copy the compose file
        env:
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: scp -i ~/.ssh/id_deploy deploy/docker-compose.prod.yml "$TARGET:/opt/edugame/docker-compose.yml"
      - name: Roll onto the new images
        env:
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          TAG: ${{ needs.images.outputs.tag }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The job token only lives as long as this job: log in, pull, log out.
          printf '%s' "$TOKEN" | ssh -i ~/.ssh/id_deploy "$TARGET" "docker login ghcr.io -u '$ACTOR' --password-stdin"
          ssh -i ~/.ssh/id_deploy "$TARGET" "TAG='$TAG' bash -s" <<'EOF'
          set -e
          cd /opt/edugame
          trap 'docker logout ghcr.io >/dev/null' EXIT
          PREV=$(sed -n 's/^TAG=//p' .env)
          set_tag() { sed -i '/^TAG=/d' .env; echo "TAG=$1" >> .env; }
          set_tag "$TAG"
          docker compose pull backend web
          docker compose up -d --remove-orphans
          for i in $(seq 1 45); do
            if docker compose exec -T web wget -qO /dev/null http://backend:8080/api/v1/game-templates; then
              docker image prune -f >/dev/null
              echo "Running $TAG"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not come up on $TAG, going back to ${PREV:-latest}"
          docker compose logs --tail 80 backend
          set_tag "${PREV:-latest}"
          docker compose up -d
          exit 1
          EOF
