name: edu-game-platform

services:
  postgres:
    image: postgres:17-alpine
    container_name: edugame-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-edugame}
      POSTGRES_USER: ${DB_USERNAME:-edugame}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-edugame}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Development mail server: catches every mail the backend sends (OTP codes...).
  # Read them at http://localhost:8025; nothing leaves this machine.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: edugame-mailpit
    restart: unless-stopped
    ports:
      - "${MAIL_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  postgres-data:
